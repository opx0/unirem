services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campus_radar
      POSTGRES_USER: campus_radar
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_radar"]
      interval: 5s
      retries: 10
  web:
    build: .
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: local-container-development-only
      POSTGRES_HOST: db
      POSTGRES_DB: campus_radar
      POSTGRES_USER: campus_radar
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/private_uploads
    command: sh -c "uv run python manage.py migrate && uv run python manage.py runserver 0.0.0.0:8000"
volumes:
  pgdata:
  uploads:
